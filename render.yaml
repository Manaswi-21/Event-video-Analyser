services:
  - type: web
    name: eventlens-api
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    healthCheckPath: /api/health
    disk:
      name: eventlens-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_DIR
        value: /var/data
      - key: MAX_UPLOAD_BYTES
        value: "262144000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

  - type: web
    name: eventlens-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: eventlens-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
